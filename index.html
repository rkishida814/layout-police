<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レイアウト警察</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --accent:#4a7bd0; --bad:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1b1a; --card:#262624; --ink:#ecece8; --muted:#a3a39c; --line:#3a3a37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.7 "Hiragino Sans","Meiryo",sans-serif; }
  header { border-bottom:1px solid var(--line); padding:14px 16px; }
  header h1 { font-size:19px; margin:0; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:16px; }
  #drop { border:2px dashed var(--line); border-radius:10px; background:var(--card); padding:28px 16px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); }
  #drop b { display:block; font-size:16px; margin-bottom:4px; }
  #drop small { color:var(--muted); }
  #status { margin:14px 0; min-height:1.7em; }
  #status.err { color:var(--bad); }
  .summary { font-size:17px; font-weight:700; margin:8px 0 4px; }
  .legend { font-size:13px; color:var(--muted); margin:0 0 16px; }
  .legend span { white-space:nowrap; margin-right:12px; }
  .legend i { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:4px; }
  h2 { font-size:16px; margin:24px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  details { margin:0 0 12px; }
  summary { cursor:pointer; color:var(--accent); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  .head { display:flex; gap:10px; align-items:baseline; }
  .no { font-weight:700; min-width:2.2em; }
  .title { flex:1; }
  .mm { color:var(--muted); font-size:13px; white-space:nowrap; }
  img { max-width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:4px; background:#fff; margin-top:8px; }
  .none { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .note { color:var(--muted); font-size:13px; margin-top:24px; }
</style>
</head>
<body>
<header>
  <h1>レイアウト警察</h1>
  <p>スライド・ポスター・文書の「揃えたつもりで、少しだけずれている」ところを、位置の数値で見つけます。直しはしません。</p>
</header>
<main>
  <div id="drop" tabindex="0" role="button" aria-label="PDF を選ぶ">
    <b>ここに PDF をドラッグ、またはクリックして選ぶ</b>
    <small>PowerPoint・Word の資料は、「ファイル → エクスポート（名前を付けて保存）→ PDF」で PDF にしてから渡してください</small>
  </div>
  <input type="file" id="file" accept=".pdf,application/pdf" hidden>
  <div id="status" aria-live="polite"></div>
  <div id="result"></div>
  <p class="note">資料はこのブラウザの中だけで調べ、どこにも送りません。最初に開いたときだけ、調べるための部品（約30MB）をインターネットから読み込みます。</p>
</main>
<script id="py-sources" type="application/json">{"__init__.py": "\"\"\"レイアウト警察：スライド・ポスター・文書のレイアウトのずれを、位置の数値だけで検出する。\"\"\"\n", "extract.py": "\"\"\"PDF の1ページから要素を取り出し、見た目の端（インクの端）で位置を測る。\n\n座標はすべて PDF の pt（左上原点）。u はページ幅の 1/1000 で、しきい値の単位に使う。\n\"\"\"\nimport math\nfrom collections import Counter\n\nimport numpy as np\nimport pymupdf\n\nRENDER_WIDTH_PX = 4000  # 計測用にページを描画するときの横幅\n\n\nclass El:\n    \"\"\"ページ上の1要素。x0,y0,x1,y1 は見た目の端。\"\"\"\n\n    def __init__(self, kind, box, label=\"\", **kw):\n        self.kind = kind\n        self.x0, self.y0, self.x1, self.y1 = [float(v) for v in box]\n        self.label = label\n        self.__dict__.update(kw)\n\n    w = property(lambda s: s.x1 - s.x0)\n    h = property(lambda s: s.y1 - s.y0)\n    cx = property(lambda s: (s.x0 + s.x1) / 2)\n    cy = property(lambda s: (s.y0 + s.y1) / 2)\n\n    def box(self):\n        return (self.x0, self.y0, self.x1, self.y1)\n\n    def __repr__(self):\n        return f\"{self.kind}({self.x0:.1f},{self.y0:.1f},{self.x1:.1f},{self.y1:.1f} {self.label!r})\"\n\n\nclass Page:\n    def __init__(self, page):\n        self.page = page\n        self.W, self.H = page.rect.width, page.rect.height\n        self.u = self.W / 1000\n        self.z = RENDER_WIDTH_PX / self.W\n        pix = page.get_pixmap(matrix=pymupdf.Matrix(self.z, self.z), alpha=False)\n        self.img = np.frombuffer(pix.samples, np.uint8).reshape(pix.h, pix.w, 3)\n\n    def _px(self, r):\n        H, W, _ = self.img.shape\n        z = self.z\n        return (max(0, int(np.floor(r[0] * z))), max(0, int(np.floor(r[1] * z))),\n                min(W, int(np.ceil(r[2] * z))), min(H, int(np.ceil(r[3] * z))))\n\n    def trim_white(self, r, thr=235):\n        \"\"\"r の範囲から、白い余白を除いた見た目の外枠を返す。\"\"\"\n        x0, y0, x1, y1 = self._px(r)\n        sub = self.img[y0:y1, x0:x1]\n        if sub.size == 0:\n            return None\n        m = sub.min(axis=2) < thr\n        # 細い罫線や点のゴミは見た目の端にしない：列（行）の 3% 以上が白でないところを中身とする\n        cols = np.nonzero(m.sum(axis=0) >= max(2, 0.03 * m.shape[0]))[0]\n        rows = np.nonzero(m.sum(axis=1) >= max(2, 0.03 * m.shape[1]))[0]\n        if len(cols) == 0 or len(rows) == 0:\n            return None\n        z = self.z\n        return ((x0 + cols.min()) / z, (y0 + rows.min()) / z,\n                (x0 + cols.max() + 1) / z, (y0 + rows.max() + 1) / z)\n\n    def fill_ratio(self, r, thr=235):\n        \"\"\"r の範囲のうち、白でない画素の割合。写真は 1 に近く、斜めの棒などの絵は小さい。\"\"\"\n        x0, y0, x1, y1 = self._px(r)\n        sub = self.img[y0:y1, x0:x1]\n        return float((sub.min(axis=2) < thr).mean()) if sub.size else 0.0\n\n    def ink_x(self, box):\n        \"\"\"文字の行の左右のインクの端。行の上下の端は少し削り、隣の行の混入を避ける。\"\"\"\n        x0, y0, x1, y1 = box\n        h = y1 - y0\n        px0, py0, px1, py1 = self._px((x0 - 1, y0 + 0.12 * h, x1 + 1, y0 + 0.88 * h))\n        sub = self.img[py0:py1, px0:px1].astype(int)\n        if sub.size == 0:\n            return x0, x1\n        q = sub >> 4\n        key = q[..., 0] * 256 + q[..., 1] * 16 + q[..., 2]\n        vals, cnt = np.unique(key, return_counts=True)\n        k = vals[cnt.argmax()]\n        bg = np.array([(k >> 8) & 15, (k >> 4) & 15, k & 15]) * 16 + 8\n        cols = np.nonzero((np.abs(sub - bg).sum(axis=2) > 90).any(axis=0))[0]\n        if len(cols) == 0:\n            return x0, x1\n        return (px0 + cols.min()) / self.z, (px0 + cols.max() + 1) / self.z\n\n\ndef _raw_lines(pg, boxes):\n    \"\"\"文字の行を取り出す。行末の空白は除き、最初と最後の文字の枠で範囲を決める。\"\"\"\n    lines = []\n    for b in pg.page.get_text(\"rawdict\")[\"blocks\"]:\n        if b[\"type\"] != 0:\n            continue\n        for l in b[\"lines\"]:\n            if abs(l[\"dir\"][0] - 1) > 1e-3:  # 縦書き・回転した文字（グラフの軸名など）は対象外\n                continue\n            chars = [(c, s) for s in l[\"spans\"] for c in s[\"chars\"]]\n            vis = [(c, s) for c, s in chars if c[\"c\"].strip()]\n            if not vis:\n                continue\n            first = vis[0][0]\n            # 行頭の記号（箇条書きの点など）の後ろ、本文の始まり\n            body = next((c for c, _ in vis[1:] if c[\"c\"] not in BULLETS), None) if first[\"c\"] in BULLETS else None\n            lines.append(dict(\n                box=[first[\"bbox\"][0], min(s[\"bbox\"][1] for _, s in vis),\n                     vis[-1][0][\"bbox\"][2], max(s[\"bbox\"][3] for _, s in vis)],\n                size=max(s[\"size\"] for _, s in vis),\n                text=_tidy(\"\".join(c[\"c\"] for c, _ in chars)),\n                color=vis[0][1][\"color\"],\n                block=b[\"number\"],\n                wide_start=_is_wide(first[\"c\"]),\n                body_x0=body[\"bbox\"][0] if body else None))\n    # 同じ行が別々のテキストボックスに分かれているもの（見出しの継ぎ足しなど）をつなぐ\n    lines.sort(key=lambda l: (round(l[\"box\"][1]), l[\"box\"][0]))\n    out = []\n    for l in lines:\n        for o in out:\n            tol = 0.15 * o[\"size\"]\n            gap = l[\"box\"][0] - o[\"box\"][2]\n            if (abs(l[\"box\"][1] - o[\"box\"][1]) < tol and abs(l[\"box\"][3] - o[\"box\"][3]) < tol\n                    and -1 <= gap < 0.6 * o[\"size\"]):\n                o[\"box\"][2] = max(o[\"box\"][2], l[\"box\"][2])\n                o[\"text\"] += \" \" + l[\"text\"]\n                break\n        else:\n            out.append(l)\n    for l in out:\n        l[\"x0\"], l[\"x1\"] = l[\"box\"][0], l[\"box\"][2]\n        l[\"y0\"], l[\"y1\"] = l[\"box\"][1], l[\"box\"][3]\n        l[\"cont\"] = _container(l, boxes)\n        b = l[\"box\"]\n        if l[\"cont\"] is not None:  # 枠線の画素を文字のインクと取り違えないよう、枠の内側だけを見る\n            inner = boxes[l[\"cont\"]].inner\n            b = [max(b[0], inner[0] + 0.5), b[1], min(b[2], inner[2] - 0.5), b[3]]\n        ink0, l[\"x1\"] = pg.ink_x(b)\n        # 和文（全角）で始まる行は、字形ごとにインクの位置が違う（「 と 研 など）ので、文字の枠の左端で揃いを見る\n        l[\"x0\"] = l[\"box\"][0] if l[\"wide_start\"] else ink0\n    return out\n\n\ndef _tidy(s):\n    \"\"\"和文の文字の間に入る余計な空白（Mac の PDF に多い）を除く。表示用。\"\"\"\n    import re\n    return re.sub(r\"(?<=[^\\x00-\\x7f]) +(?=[^\\x00-\\x7f]|[,.])\", \"\", s).strip()\n\n\nBULLETS = set(\"•●○◦・▪■□◆◇▶►‣-–—※☑✓✔*→⇒\")\n\n\ndef _is_wide(ch):\n    import unicodedata\n    return unicodedata.east_asian_width(ch) in (\"W\", \"F\")\n\n\ndef _container(e, boxes):\n    \"\"\"行を含む最小の枠・塗りの番号（boxes の添字）。\"\"\"\n    inside = [b for b in boxes if b.x0 <= e[\"x0\"] + 1 and e[\"x1\"] - 1 <= b.x1 and b.y0 <= (e[\"y0\"] + e[\"y1\"]) / 2 <= b.y1]\n    return boxes.index(min(inside, key=lambda b: b.w * b.h)) if inside else None\n\n\ndef _paragraphs(lines, boxes):\n    \"\"\"行を段落にまとめる。同じ大きさ・色・入れ物で、上下に詰まって並ぶ行を1つにする。\"\"\"\n    paras = []\n    for l in sorted(lines, key=lambda l: l[\"y0\"]):\n        best = None\n        for p in paras:\n            q = p[-1]\n            gap = l[\"y0\"] - q[\"y1\"]\n            # 同じテキストボックス（PDF の文字ブロック）の行は、行間を詰めて重なっていても続きとみなす\n            lo = -0.6 if l[\"block\"] == q[\"block\"] else -0.35\n            if (abs(l[\"size\"] - q[\"size\"]) < 0.6 and l[\"color\"] == q[\"color\"] and l[\"cont\"] == q[\"cont\"]\n                    and lo * q[\"size\"] <= gap <= 0.3 * q[\"size\"]\n                    and min(l[\"x1\"], q[\"x1\"]) - max(l[\"x0\"], q[\"x0\"]) > 0):\n                best = p\n        if best is None:\n            paras.append([l])\n        else:\n            best.append(l)\n    return [El(\"text\", (min(l[\"x0\"] for l in ls), min(l[\"y0\"] for l in ls),\n                        max(l[\"x1\"] for l in ls), max(l[\"y1\"] for l in ls)),\n               ls[0][\"text\"][:40], lines=ls, size=max(l[\"size\"] for l in ls)) for ls in paras]\n\n\ndef _content_frac(doc, xref, thr=235):\n    \"\"\"画像の中で、白でも透明でもない部分の範囲を、画像の縦横に対する割合で返す。\n    あわせて、画像の中の透明な画素の割合を返す（切り抜きのイラスト・矢印の絵は大きい）。\"\"\"\n    try:\n        pm = pymupdf.Pixmap(doc, xref)\n        if pm.colorspace is None or pm.colorspace.n != 3:\n            pm = pymupdf.Pixmap(pymupdf.csRGB, pm)\n        if pm.alpha:\n            pm = pymupdf.Pixmap(pm, 0)\n    except Exception:\n        return (0, 0, 1, 1), 0.0\n    a = np.frombuffer(pm.samples, np.uint8).reshape(pm.h, pm.w, 3)\n    m = a.min(axis=2) < thr\n    clear = 0.0\n    typ, val = doc.xref_get_key(xref, \"SMask\")\n    if typ == \"xref\":\n        sm = pymupdf.Pixmap(doc, int(val.split()[0]))\n        if (sm.w, sm.h) == (pm.w, pm.h):\n            al = np.frombuffer(sm.samples, np.uint8).reshape(sm.h, sm.w, sm.n)[..., 0]\n            m = m & (al > 30)\n            clear = float((al <= 30).mean())\n    cols = np.nonzero(m.sum(axis=0) >= max(2, 0.03 * pm.h))[0]\n    rows = np.nonzero(m.sum(axis=1) >= max(2, 0.03 * pm.w))[0]\n    if len(cols) == 0 or len(rows) == 0:\n        return None, clear\n    return (cols.min() / pm.w, rows.min() / pm.h, (cols.max() + 1) / pm.w, (rows.max() + 1) / pm.h), clear\n\n\ndef _images(pg, doc):\n    out = []\n    for info in pg.page.get_image_info(xrefs=True):\n        r = pymupdf.Rect(info[\"bbox\"]) & pg.page.rect\n        if r.is_empty:\n            continue\n        vis = tuple(r)\n        xref, t = info.get(\"xref\", 0), info[\"transform\"]\n        clear = 0.0\n        if xref and abs(t[1]) < 1e-6 and abs(t[2]) < 1e-6:\n            # 画像そのものの画素で中身の範囲を測る（重なった枠や文字を画像の端と取り違えない）\n            frac, clear = _content_frac(doc, xref)\n            if frac is None:\n                continue  # 透明または真っ白な画像\n            fx, fy = np.array(frac[0::2]), np.array(frac[1::2])\n            X, Y = t[4] + fx * t[0], t[5] + fy * t[3]\n            vis = (max(r.x0, X.min()), max(r.y0, Y.min()), min(r.x1, X.max()), min(r.y1, Y.max()))\n            if vis[0] >= vis[2] or vis[1] >= vis[3]:\n                continue\n        trimmed = pg.trim_white(vis)\n        if trimmed is None:\n            continue\n        # ページの描画でさらに白い余白を削る（トリミングされて見えない部分を除くため）\n        vis = trimmed\n        # 斜めに回した画像は図の部品（模式図の棒など）で、配置を揃える対象ではない\n        ang = math.degrees(math.atan2(t[1], t[0])) % 90\n        kind = \"image\" if min(ang, 90 - ang) < 2 else \"part\"\n        # 背景を透明にした切り抜きのイラスト・矢印の絵は、写真や図のように端を揃える対象ではない\n        out.append(El(kind, vis, f\"画像@({vis[0]:.0f},{vis[1]:.0f})\", fill=pg.fill_ratio(vis), cutout=clear >= 0.4,\n                      placed=tuple(r)))\n    return out\n\n\ndef _drawings(pg):\n    out, u = [], pg.u\n    drawings = pg.page.get_drawings()\n    # 同じ形・大きさの小さな図形（10u 未満）がたくさんあるもの（粉末の粒などの模様）は、矢印ではない\n    shape = lambda dr: (tuple(it[0] for it in dr[\"items\"]), round(dr[\"rect\"].width), round(dr[\"rect\"].height))\n    count = Counter(shape(dr) for dr in drawings)\n    for dr in drawings:\n        r = dr[\"rect\"]\n        kinds = [it[0] for it in dr[\"items\"]]\n        typ = dr.get(\"type\") or \"\"\n        if r.width > 0.95 * pg.W and r.height > 0.95 * pg.H:\n            continue\n        if r.width > 0.85 * pg.W and r.height < 0.06 * pg.H:\n            out.append(El(\"bar\", tuple(r)))\n        elif kinds == [\"re\"] and r.width > 10 * u and r.height > 10 * u:\n            sw = (dr.get(\"width\") or 0) if \"s\" in typ else 0\n            if sw:\n                out.append(El(\"frame\", (r.x0 - sw / 2, r.y0 - sw / 2, r.x1 + sw / 2, r.y1 + sw / 2),\n                              f\"枠@({r.x0:.0f},{r.y0:.0f})\",\n                              inner=(r.x0 + sw / 2, r.y0 + sw / 2, r.x1 - sw / 2, r.y1 - sw / 2)))\n            elif dr.get(\"fill\") and min(dr[\"fill\"]) < 0.97:\n                out.append(El(\"panel\", tuple(r), f\"塗り@({r.x0:.0f},{r.y0:.0f})\", inner=tuple(r)))\n        elif (\"f\" in typ and set(kinds) <= {\"l\", \"c\"} and 3 <= len(kinds) <= 12\n              and 2 * u < max(r.width, r.height) < 40 * u\n              and (count[shape(dr)] < 10 or max(r.width, r.height) >= 10 * u)):\n            pts = [p for it in dr[\"items\"] for p in it[1:] if isinstance(p, pymupdf.Point)]\n            my, mx = sum(p.y for p in pts) / len(pts), sum(p.x for p in pts) / len(pts)\n            if r.width >= r.height:\n                d = \"down\" if my < (r.y0 + r.y1) / 2 else \"up\"\n            else:\n                d = \"right\" if mx < (r.x0 + r.x1) / 2 else \"left\"\n            # 曲線だけの図形（円・楕円）は尖った先が無く、向きを持たない\n            out.append(El(\"arrow\", tuple(r), f\"矢印@({r.x0:.0f},{r.y0:.0f})\", dir=d, round=\"l\" not in kinds))\n    return out\n\n\ndef _covered_by_text(e, texts):\n    \"\"\"画像のうち、ほぼ全体が文字に重なっているもの（文字の影・チェックボックス記号など）。\"\"\"\n    area = e.w * e.h\n    if area <= 0:\n        return True\n    cov = 0.0\n    for t in texts:\n        for l in t.lines:\n            ix = min(e.x1, l[\"box\"][2] + 0.3 * l[\"size\"]) - max(e.x0, l[\"box\"][0] - 0.3 * l[\"size\"])\n            iy = min(e.y1, l[\"y1\"]) - max(e.y0, l[\"y0\"])\n            if ix > 0 and iy > 0:\n                cov += ix * iy\n    return cov >= 0.8 * area\n\n\ndef _rotated_text(pg):\n    \"\"\"縦に回した文字（グラフの縦軸名など）。左右の端の比較にだけ使う。\"\"\"\n    out = []\n    for b in pg.page.get_text(\"dict\")[\"blocks\"]:\n        for l in b.get(\"lines\", []):\n            if abs(l[\"dir\"][0]) < 1e-3 and \"\".join(s[\"text\"] for s in l[\"spans\"]).strip():\n                vis = pg.trim_white(l[\"bbox\"])\n                if vis:\n                    t = \"\".join(s[\"text\"] for s in l[\"spans\"]).strip()\n                    out.append(El(\"vtext\", vis, t[:40]))\n    return out\n\n\ndef extract(doc, pno):\n    pg = Page(doc[pno])\n    drawings = _drawings(pg)\n    boxes = [d for d in drawings if d.kind in (\"frame\", \"panel\")]\n    texts = _paragraphs(_raw_lines(pg, boxes), boxes)\n    els = list(texts) + _rotated_text(pg)\n    for e in _images(pg, doc) + drawings:\n        if e.kind == \"image\":\n            if min(e.w, e.h) < 1.5 * pg.u or (e.w > 0.9 * pg.W and e.h > 0.9 * pg.H):\n                continue\n            if e.w > 0.85 * pg.W and e.h < 0.06 * pg.H:\n                e.kind = \"bar\"\n            elif min(e.w, e.h) < 4 * pg.u:\n                e.kind = \"line\"  # 有意差の括弧などの細い線。比較の対象にしない\n            elif _covered_by_text(e, texts):\n                continue\n        els.append(e)\n    # 文字を含まない小さな塗りは、グラフの棒などなので除く\n    for e in [e for e in els if e.kind == \"panel\"]:\n        has_text = any(e.x0 <= t.cx <= e.x1 and e.y0 <= t.cy <= e.y1 for t in texts)\n        if not has_text and not (e.w > 60 * pg.u and e.h > 60 * pg.u):\n            els.remove(e)\n    els = _merge_illustrations(els)\n    for i, e in enumerate(els):\n        e.id = i\n    return pg, els\n\n\ndef _merge_illustrations(els):\n    \"\"\"重なり合う3つ以上の画像・図形（結晶の模式図など、部品を組み合わせた図）を、1つの図として扱う。\n\n    大きな画像の内側にほぼ収まる画像（背景の上に置いた写真など）は、その画像の一部として除く。\n    \"\"\"\n    def inside(a, b):\n        ix = min(a.x1, b.x1) - max(a.x0, b.x0)\n        iy = min(a.y1, b.y1) - max(a.y0, b.y0)\n        return ix > 0 and iy > 0 and ix * iy >= 0.9 * a.w * a.h and b.w * b.h > a.w * a.h\n    texts = [e for e in els if e.kind == \"text\"]\n    # 入れ物になるもの：画像と、文字を含まない塗り（写真の背景の灰色の四角など）\n    holders = [e for e in els if e.kind == \"image\" or (\n        e.kind == \"panel\" and not any(e.x0 <= t.cx <= e.x1 and e.y0 <= t.cy <= e.y1 for t in texts))]\n    els = [e for e in els if not (e.kind == \"image\" and any(inside(e, o) for o in holders if o is not e))]\n    parts = [e for e in els if e.kind in (\"image\", \"arrow\")]\n    parent = {id(e): e for e in parts}\n\n    def find(e):\n        while parent[id(e)] is not e:\n            e = parent[id(e)]\n        return e\n    for i, a in enumerate(parts):\n        for b in parts[i + 1:]:\n            if min(a.x1, b.x1) > max(a.x0, b.x0) and min(a.y1, b.y1) > max(a.y0, b.y0):\n                parent[id(find(a))] = find(b)\n    groups = {}\n    for e in parts:\n        groups.setdefault(id(find(e)), []).append(e)\n    out = [e for e in els if e.kind not in (\"image\", \"arrow\")]\n    for g in groups.values():\n        if len(g) >= 3:\n            box = (min(e.x0 for e in g), min(e.y0 for e in g), max(e.x1 for e in g), max(e.y1 for e in g))\n            out.append(El(\"image\", box, f\"図（部品 {len(g)} 個）@({box[0]:.0f},{box[1]:.0f})\",\n                          cutout=2 * sum(getattr(e, \"cutout\", False) for e in g) >= len(g)))\n        else:\n            out.extend(g)\n    return out\n", "structure.py": "\"\"\"要素から、区画（帯で区切られた範囲）・段・見出しの印を推定する。意味は読まず、位置だけで決める。\"\"\"\nfrom statistics import median\n\n\ndef _cluster(values, tol):\n    \"\"\"1次元の値を、隣との差が tol 以下ならつなげてまとめる。\"\"\"\n    groups = []\n    for v in sorted(values):\n        if groups and v - groups[-1][-1] <= tol:\n            groups[-1].append(v)\n        else:\n            groups.append([v])\n    return groups\n\n\ndef body_size(els):\n    sizes = [l[\"size\"] for e in els if e.kind == \"text\" for l in e.lines for _ in range(len(l[\"text\"]))]\n    return median(sizes) if sizes else 0\n\n\ndef find_markers(els, u):\n    \"\"\"見出しの左に置かれた小さな記号（■など）と見出しの組。\"\"\"\n    bs = body_size(els)\n    pairs = []\n    for m in els:\n        if m.kind != \"image\" or not (5 * u <= m.w <= 25 * u and 5 * u <= m.h <= 25 * u and 0.6 < m.w / m.h < 1.6):\n            continue\n        best = None\n        for t in els:\n            if t.kind != \"text\" or t.size < bs:\n                continue\n            l = t.lines[0]\n            gap = l[\"x0\"] - m.x1\n            if l[\"y0\"] <= m.cy <= l[\"y1\"] and -1 <= gap <= 20 * u and (best is None or gap < best[1]):\n                best = (t, gap)\n        if best:\n            m.role = \"marker\"\n            best[0].role = \"heading\"\n            pairs.append((m, best[0]))\n    return pairs\n\n\ndef build(pg, els):\n    u, W = pg.u, pg.W\n    bars = sorted([e for e in els if e.kind == \"bar\"], key=lambda e: e.y0)\n    bands = []\n    for b in bars:\n        if bands and b.y0 <= bands[-1][1] + 2 * u:\n            bands[-1][1] = max(bands[-1][1], b.y1)\n        else:\n            bands.append([b.y0, b.y1])\n    edges = [0] + [y for band in bands for y in band] + [pg.H]\n    sections = [(edges[i], edges[i + 1]) for i in range(0, len(edges), 2)]\n\n    pairs = find_markers(els, u)\n    for e in els:\n        e.band_title = e.kind == \"text\" and any(b0 <= e.cy <= b1 for b0, b1 in bands)\n        e.sec = next((i for i, (a, b) in enumerate(sections) if a <= e.cy <= b), None)\n    pg.bands, pg.sections, pg.marker_pairs = bands, sections, pairs\n\n    # 段：区画ごとに、見出しの印の左端を段の始まりとする。印が無ければ、縦の空白で分ける\n    pg.columns = {}\n    for si, (a, b) in enumerate(sections):\n        mine = [e for e in els if e.sec == si and e.kind != \"bar\" and not e.band_title]\n        if not mine:\n            continue\n        anchors = [g[0] for g in _cluster([m.x0 for m, _ in pairs if m.sec == si], 40 * u)]\n        if len(anchors) < 2:\n            anchors = _gutters(mine, u, W)\n        cols = []\n        for i, x in enumerate(anchors):\n            start = 0 if i == 0 else x - 15 * u\n            end = W if i == len(anchors) - 1 else anchors[i + 1] - 15 * u\n            cols.append((start, end, x))\n        pg.columns[si] = cols\n        for e in mine:\n            e.col = next((ci for ci, (s, t, _) in enumerate(cols) if s <= e.cx < t), len(cols) - 1)\n    for e in els:\n        if not hasattr(e, \"col\"):\n            e.col = None\n\n\ndef _gutters(mine, u, W):\n    \"\"\"要素の横の重なりを数え、どの要素もない縦の帯（幅 8u 以上）で段を分ける。\"\"\"\n    span = [e for e in mine if e.w < 0.6 * W]\n    if not span:\n        return [min(e.x0 for e in mine)]\n    lo, hi = min(e.x0 for e in span), max(e.x1 for e in span)\n    step = u\n    n = int((hi - lo) / step) + 1\n    cov = [0] * n\n    for e in span:\n        for k in range(int((e.x0 - lo) / step), min(n, int((e.x1 - lo) / step) + 1)):\n            cov[k] += 1\n    anchors, k = [lo], 0\n    while k < n:\n        if cov[k] == 0:\n            j = k\n            while j < n and cov[j] == 0:\n                j += 1\n            if (j - k) * step >= 8 * u and j < n:\n                anchors.append(lo + j * step)\n            k = j\n        else:\n            k += 1\n    return anchors\n", "rules.py": "\"\"\"ずれの検出規則。どれも「ほぼ揃っているが揃っていない」を位置の数値だけで判定する。\n\nしきい値は u（ページ幅の 1/1000）で決めるので、スライドでもポスターでも同じ規則が使える。\n  EPS  … これ以下の差は揃っているとみなす\n  NEAR … これ未満の差は「揃えようとして失敗した」とみなす。これ以上は意図的に離したとみなす\n\"\"\"\nimport re\nfrom collections import defaultdict\n\nfrom .structure import body_size\n\nPT2MM = 25.4 / 72\n\n\nclass Finding:\n    def __init__(self, rule, title, delta, marks, els):\n        self.rule, self.title, self.delta = rule, title, delta\n        self.marks = marks  # (axis 'v'|'h', 位置, 始点, 終点, 'ref'|'bad')\n        self.els = els\n        self.context = None  # 画像に必ず含める範囲（帯の全幅など）\n        self.dims = []  # 寸法線 (x0, x1, y, 文字)：左右の余白などを示す\n\n    def sort_key(self):\n        bad = [m for m in self.marks if m[4] == \"bad\"] or self.marks\n        m = bad[0]\n        return (getattr(self.els[0], \"sec\", 0) or 0, m[2] if m[0] == \"v\" else m[1], m[1] if m[0] == \"v\" else m[2])\n\n    def to_dict(self):\n        return dict(rule=self.rule, title=self.title, delta_pt=round(self.delta, 1),\n                    delta_mm=round(self.delta * PT2MM, 1),\n                    elements=[dict(kind=e.kind, label=e.label, box=[round(v, 1) for v in e.box()]) for e in self.els],\n                    marks=[dict(axis=a, pos=round(p, 1), start=round(s, 1), end=round(t, 1), role=r)\n                           for a, p, s, t, r in self.marks])\n\n\ndef mm(pt):\n    return f\"{abs(pt) * PT2MM:.1f} mm\"\n\n\ndef _name(e):\n    if e.kind == \"text\":\n        return f\"「{e.label[:24]}」\"\n    if e.kind == \"vtext\":\n        return f\"縦の文字「{e.label[:24]}」\"\n    return {\"image\": \"画像\", \"frame\": \"枠\", \"panel\": \"塗りの枠\", \"arrow\": \"矢印\"}.get(e.kind, e.kind)\n\n\ndef classify_align(t, eps):\n    ls = t.lines\n    if len(ls) == 1:\n        return \"single\"\n    tol = max(eps, 0.06 * t.size)\n    spread = lambda vals: max(vals) - min(vals)\n    lefts = [l[\"x0\"] for l in ls]\n    centers = [(l[\"x0\"] + l[\"x1\"]) / 2 for l in ls]\n    rights = [l[\"x1\"] for l in ls]\n    if spread(lefts) <= tol:\n        return \"left\"\n    # PowerPoint は行末の空白も含めて中央に置くので、インクの中心は半角空白の半分ほど揺れる\n    if spread(centers) <= 0.25 * t.size and spread(centers) < 0.35 * spread(lefts):\n        return \"center\"\n    if spread(rights) <= tol:\n        return \"right\"\n    return \"indented\"\n\n\nclass _UF:\n    def __init__(self):\n        self.p = {}\n\n    def find(self, a):\n        self.p.setdefault(a, a)\n        while self.p[a] != a:\n            self.p[a] = self.p[self.p[a]]\n            a = self.p[a]\n        return a\n\n    def union(self, a, b):\n        self.p[self.find(a)] = self.find(b)\n\n\ndef _contains(a, b):\n    return a.x0 <= b.cx <= a.x1 and a.y0 <= b.cy <= a.y1\n\n\ndef _vgap(a, b):\n    return max(a.y0, b.y0) - min(a.y1, b.y1)\n\n\ndef _hgap(a, b):\n    return max(a.x0, b.x0) - min(a.x1, b.x1)\n\n\ndef _tol(e, eps):\n    \"\"\"文字は字形ごとに左右の余白が違うので、大きさに応じて許容を広げる。\"\"\"\n    return max(eps, 0.08 * e.size) if e.kind == \"text\" else eps\n\n\ndef _ctol(t, eps):\n    \"\"\"中央揃えの文字の中心の許容。行末の空白の分（半角空白の半分ほど）は揺れとみなす。\"\"\"\n    return max(1.5 * eps, 0.15 * t.size)\n\n\ndef _split(comp, near):\n    \"\"\"つながった組の幅が near を超えるときは、いちばん大きな隙間で割る。\"\"\"\n    comp = sorted(comp, key=lambda x: x[1])\n    if comp[-1][1] - comp[0][1] < near or len(comp) < 2:\n        return [comp]\n    k = max(range(1, len(comp)), key=lambda i: comp[i][1] - comp[i - 1][1])\n    return _split(comp[:k], near) + _split(comp[k:], near)\n\n\ndef _edge_groups(items, linked, near, eps):\n    \"\"\"items: (要素, 値)。linked(a, b) が真で値の差が near 未満の組をつなぎ、ばらつく組を返す。\"\"\"\n    uf = _UF()\n    for i in range(len(items)):\n        uf.find(i)\n        for j in range(i + 1, len(items)):\n            (a, va), (b, vb) = items[i], items[j]\n            if a is not b and abs(va - vb) < near and linked(a, b):\n                uf.union(i, j)\n    comps = defaultdict(list)\n    for i in range(len(items)):\n        comps[uf.find(i)].append(items[i])\n    out = []\n    for whole in comps.values():\n        for comp in _split(whole, near):\n            if len(comp) < 2:\n                continue\n            # 値を許容の範囲でまとめ、要素の多い位置（同数なら大きい要素の位置）を基準とする\n            subs = []\n            for e, v in comp:\n                if subs and v - subs[-1][-1][1] <= max(_tol(e, eps), _tol(subs[-1][-1][0], eps)):\n                    subs[-1].append((e, v))\n                else:\n                    subs.append([(e, v)])\n            if len(subs) < 2:\n                continue\n            ref = max(subs, key=lambda s: (len(s), sum(e.w * e.h for e, _ in s)))\n            out.append((comp, subs, ref))\n    return out\n\n\ndef check(pg, els):\n    u, W = pg.u, pg.W\n    EPS, NEAR, VNEAR = max(1.0, 0.6 * u), 12 * u, 100 * u\n    F = []\n    for e in els:\n        # 小さな画像（図の部品・アイコン・小さな矢印の絵）は、配置を揃える対象にしない。見出しの記号は別に扱う\n        if e.kind == \"image\" and getattr(e, \"role\", \"\") != \"marker\" and max(e.w, e.h) < 0.04 * W:\n            e.kind = \"part\"\n    imgs = [e for e in els if e.kind == \"image\" and getattr(e, \"role\", \"\") != \"marker\"]\n    # 端・大きさを揃える対象の画像（切り抜きのイラスト・矢印の絵は除く。キャプションの判定には使う）\n    photos = [e for e in imgs if not getattr(e, \"cutout\", False)]\n    bsize = body_size(els)\n    texts = []\n    for t in [e for e in els if e.kind == \"text\" and not e.band_title]:\n        t.align = classify_align(t, EPS)\n        # 図の上に重ねた文字（軸の目盛りなど）と、記号だけの短い文字は図の一部として扱う\n        s = \"\".join(l[\"text\"] for l in t.lines)\n        t.minor = (sum(not c.isspace() for c in s) < 3 or re.fullmatch(r\"[\\d\\s.,%±+*()\\-–]+\", s) is not None\n                   or any(_contains(im, t) for im in imgs))\n        if not t.minor:\n            texts.append(t)\n    boxes = [e for e in els if e.kind in (\"frame\", \"panel\")]\n\n    # R1 区切りの帯の見出しが、帯の中央にあるか\n    for t in [e for e in els if e.kind == \"text\" and e.band_title]:\n        d = t.cx - W / 2\n        if EPS < abs(d) < 80 * u:\n            f = Finding(\"R1\", f\"帯の中の文字{_name(t)}が、左右の中央から{'右' if d > 0 else '左'}へ {mm(d)} ずれている\"\n                              f\"（文字の見た目の端から、左の余白 {mm(t.x0)}・右の余白 {mm(W - t.x1)}）\",\n                        abs(d), [(\"v\", W / 2, t.y0 - 4 * u, t.y1 + 4 * u, \"ref\"),\n                                 (\"v\", t.cx, t.y0 - 4 * u, t.y1 + 4 * u, \"bad\")], [t])\n            f.context = (0, t.y0 - 6 * u, W, t.y1 + 6 * u)\n            f.dims = [(0, t.x0, t.cy, f\"左 {mm(t.x0)}\"), (t.x1, W, t.cy, f\"右 {mm(W - t.x1)}\")]\n            F.append(f)\n\n    # R1/R6 枠・塗りの中の文字：中央揃えの中心、左右の余白、はみ出し\n    for b in boxes:\n        inside = [t for t in texts if all(_contains(b, _P(l)) for l in t.lines)]\n        if not inside:\n            continue\n        ix0, iy0, ix1, iy1 = b.inner\n        for t in inside:\n            if t.align in (\"center\", \"single\") and getattr(t, \"role\", \"\") != \"heading\":\n                d = t.cx - (ix0 + ix1) / 2\n                if _ctol(t, EPS) < abs(d) < NEAR and len(inside) == 1:\n                    F.append(Finding(\"R1\", f\"{_name(t)}が枠の中央から {mm(d)} ずれている\", abs(d),\n                                     [(\"v\", (ix0 + ix1) / 2, b.y0, b.y1, \"ref\"), (\"v\", t.cx, t.y0, t.y1, \"bad\")], [t, b]))\n        lpad = min(t.x0 for t in inside) - ix0\n        rpad = ix1 - max(t.x1 for t in inside)\n        far_r = max((l for t in inside for l in t.lines), key=lambda l: l[\"x1\"])\n        far_l = min((l for t in inside for l in t.lines), key=lambda l: l[\"x0\"])\n        for side, pad, other, x in ((\"右\", rpad, lpad, ix1), (\"左\", lpad, rpad, ix0)):\n            l = far_r if side == \"右\" else far_l\n            edge = _Edge(l[\"x1\"] if side == \"右\" else l[\"x0\"], l[\"y0\"], l[\"y1\"])\n            if pad < -EPS:\n                F.append(Finding(\"R6\", f\"文字が枠の{side}からはみ出している（{mm(pad)}）\", -pad,\n                                 [(\"v\", x, b.y0, b.y1, \"ref\"), (\"v\", x - pad if side == \"右\" else x + pad, b.y0, b.y1, \"bad\")], [b]))\n            elif pad < max(EPS, 1.5 * u) and other > 2 * max(pad, 0.5):\n                F.append(Finding(\"R6\", f\"文字が枠の{side}の線にほぼ接している（余白 {mm(max(pad, 0))}、反対側は {mm(other)}）\",\n                                 other - pad, [(\"v\", x, b.y0, b.y1, \"ref\"), (\"v\", edge.x, edge.y0, edge.y1, \"bad\")], [b]))\n\n    # R3 キャプション：写真のすぐ上・下の短い文字は、写真（横に並んだ写真の組）の中央に置く\n    for t in texts:\n        if (len(t.lines) > 3 or t.align not in (\"center\", \"single\") or getattr(t, \"role\", \"\") == \"heading\"\n                or t.size >= 1.15 * bsize):  # 本文より大きい文字は見出しで、キャプションではない\n            continue\n        cands = []\n        for im in imgs:\n            if im.sec != t.sec or not (im.x0 <= t.cx <= im.x1):\n                continue\n            # 画像を貼った範囲に食い込み、同じ高さに別の文字も並ぶもの（0Ag 0.01Ag …）は、グラフの目盛りで、キャプションではない\n            px0, py0, px1, py1 = getattr(im, \"placed\", im.box())\n            inside = lambda o: px0 <= o.cx <= px1 and min(o.y1, py1) - max(o.y0, py0) >= 0.3 * o.h\n            if inside(t) and sum(1 for o in texts if abs(o.cy - t.cy) < 0.5 * t.size and inside(o)) >= 2:\n                continue\n            below, above = t.y0 - im.y1, im.y0 - t.y1\n            if -0.3 * t.size <= below <= 1.2 * t.size:\n                cands.append((below, im, \"below\"))\n            elif -0.3 * t.size <= above <= 1.2 * t.size:\n                cands.append((above, im, \"above\"))\n        if not cands:\n            continue\n        _, im, where = min(cands, key=lambda c: c[0])\n        key = (lambda e: e.y1) if where == \"below\" else (lambda e: e.y0)\n        row = [o for o in imgs if o.sec == t.sec and abs(key(o) - key(im)) < NEAR\n               and min(o.x1, t.x1) - max(o.x0, t.x0) > 0.1 * t.w]\n        if im not in row:\n            row.append(im)\n        x0, x1 = min(o.x0 for o in row), max(o.x1 for o in row)\n        t.caption = True\n        d = t.cx - (x0 + x1) / 2\n        if _ctol(t, EPS) < abs(d) < 25 * u:\n            what = \"並んだ写真の組\" if len(row) > 1 else \"写真\"\n            F.append(Finding(\"R3\", f\"キャプション{_name(t)}が{what}の中央から{'右' if d > 0 else '左'}へ {mm(d)} ずれている\",\n                             abs(d), [(\"v\", (x0 + x1) / 2, min(o.y0 for o in row), max(o.y1 for o in row), \"ref\"),\n                                      (\"v\", t.cx, t.y0, t.y1, \"bad\")], [t] + row))\n\n    # R4 矢印：指す先の文字（または要素）の中央に置く\n    for a in [e for e in els if e.kind == \"arrow\"]:\n        # すぐ右に文字が続く小さな図形は、凡例の記号であって矢印ではない\n        if any(0 <= l[\"x0\"] - a.x1 <= 10 * u and l[\"y0\"] <= a.cy <= l[\"y1\"]\n               for t in els if t.kind == \"text\" for l in t.lines):\n            continue\n        if a.dir in (\"down\", \"up\"):\n            if getattr(a, \"round\", False):  # 丸は下の文字を指さない（模式図の粒など）\n                continue\n            if a.dir == \"down\":\n                cs = [t for t in texts if t.y0 >= a.y0 and t.y0 - a.y1 <= 2 * t.size and t.x0 <= a.cx <= t.x1]\n                tgt = min(cs, key=lambda t: t.y0, default=None)\n            else:\n                cs = [t for t in texts if t.y1 <= a.y1 and a.y0 - t.y1 <= 2 * t.size and t.x0 <= a.cx <= t.x1]\n                tgt = max(cs, key=lambda t: t.y1, default=None)\n            if tgt is None or tgt.align not in (\"center\", \"single\"):\n                continue\n            d = a.cx - tgt.cx\n            if _ctol(tgt, EPS) < abs(d) < 40 * u:\n                F.append(Finding(\"R4\", f\"矢印が指す先{_name(tgt)}の中央から{'右' if d > 0 else '左'}へ {mm(d)} ずれている\",\n                                 abs(d), [(\"v\", tgt.cx, tgt.y0, tgt.y1, \"ref\"), (\"v\", a.cx, a.y0 - 2 * u, a.y1 + 2 * u, \"bad\")], [a, tgt]))\n        else:\n            for o in [e for e in els if e.kind in (\"image\", \"text\") and e.sec == a.sec]:\n                gap = o.x0 - a.x1 if a.dir == \"right\" else a.x0 - o.x1\n                if 0 <= gap <= 30 * u and o.y0 <= a.cy <= o.y1:\n                    d = a.cy - o.cy\n                    if 2 * EPS < abs(d) < 30 * u:\n                        F.append(Finding(\"R4\", f\"矢印の高さが{_name(o)}の中央から {mm(d)} ずれている\", abs(d),\n                                         [(\"h\", o.cy, o.x0, o.x1, \"ref\"), (\"h\", a.cy, a.x0 - 2 * u, a.x1 + 2 * u, \"bad\")], [a, o]))\n                    break\n\n    # R2 同じ段の中で、左端・右端がほぼ揃っているが揃っていない\n    def colmates(a, b):\n        # 見出しの記号は記号どうしでだけ比べる（本文や写真を記号から字下げするのはよくある意図的な配置）\n        ra, rb = getattr(a, \"role\", \"\"), getattr(b, \"role\", \"\")\n        if (ra == \"marker\") != (rb == \"marker\"):\n            return False\n        # 記号どうし・見出しどうしは、同じ段の中なら離れていても比べる\n        far_ok = ra == rb and ra in (\"marker\", \"heading\")\n        # 段の主な縦の線（3つ以上の要素が乗る線）に乗る要素とは、離れていても比べる\n        far_ok = far_ok or (id(a) in on_main) != (id(b) in on_main)\n        return (a.sec == b.sec and a.col == b.col and (far_ok or _vgap(a, b) <= VNEAR)\n                and not _contains(a, b) and not _contains(b, a))\n\n    def main_lines(items):\n        \"\"\"段ごとに、いちばん多くの要素が乗る縦の線（3つ以上）の要素を返す。\"\"\"\n        on = set()\n        bycol = defaultdict(list)\n        for e, v in items:\n            if getattr(e, \"role\", \"\") != \"marker\":\n                bycol[(e.sec, e.col)].append((e, v))\n        for its in bycol.values():\n            best = []\n            for e, v in its:\n                grp = [x for x in its if abs(x[1] - v) <= EPS]\n                if len(grp) > len(best):\n                    best = grp\n            if len(best) >= 3:\n                on.update(id(e) for e, _ in best)\n        return on\n\n    def inset_only(subs, side):\n        \"\"\"枠・塗り（表のセルなど）の端と、その中に置いた文字の端が、文字の標準の余白（約 2.5 mm）だけ離れている組。\n        外側の線に枠が乗り、内側の線には文字だけが揃って乗っていれば、枠の中に置いた文字として揃っている。\"\"\"\n        if len(subs) != 2:\n            return False\n        outer, inner = subs if side == \"左端\" else subs[::-1]\n        boxes_ = [v for e, v in outer if e.kind in (\"frame\", \"panel\")]\n        if not boxes_ or not all(e.kind == \"text\" for e, _ in inner):\n            return False\n        tv = [v for _, v in inner]\n        if max(tv) - min(tv) > EPS:\n            return False\n        d = min(abs(sum(tv) / len(tv) - v) for v in boxes_)\n        return 1.5 / PT2MM <= d <= 3.6 / PT2MM\n\n    left_items, right_items = [], []\n    for e in els:\n        if e.col is None or getattr(e, \"band_title\", False):\n            continue\n        if e.kind == \"image\" and getattr(e, \"cutout\", False):\n            continue\n        if e.kind in (\"image\", \"frame\", \"panel\"):\n            left_items.append((e, e.x0))\n            if getattr(e, \"role\", \"\") != \"marker\":\n                right_items.append((e, e.x1))\n        elif e.kind == \"vtext\":\n            left_items.append((e, e.x0))\n            right_items.append((e, e.x1))\n        elif e.kind == \"text\" and (e.minor or (len(e.lines) == 1 and e.lines[0][\"cont\"] is not None)):\n            continue  # 枠の中の1行の文字は枠の中で置かれるもので、揃えるのは枠のほう\n        elif e.kind == \"text\" and not getattr(e, \"caption\", False) and e.align in (\"left\", \"single\", \"indented\"):\n            left_items.append((e, e.x0))\n        elif e.kind == \"text\" and e.align == \"right\":\n            right_items.append((e, e.x1))\n    for items, side in ((left_items, \"左端\"), (right_items, \"右端\")):\n        on_main = main_lines(items)\n        for comp, subs, ref in _edge_groups(items, colmates, NEAR, EPS):\n            if inset_only(subs, side):\n                continue\n            vals = [v for _, v in comp]\n            marks = [(\"v\", v, e.y0, e.y1, \"ref\" if s is ref else \"bad\") for s in subs for e, v in s]\n            F.append(Finding(\"R2\", f\"{side}がわずかにずれている（{mm(max(vals) - min(vals))}）：\"\n                             + \"、\".join(_name(e) for e, _ in comp), max(vals) - min(vals), marks, [e for e, _ in comp]))\n\n    # R2 横に並んだ要素の上端・下端\n    def rowmates(a, b):\n        ov = min(a.y1, b.y1) - max(a.y0, b.y0)\n        if a.sec != b.sec or ov < 0.5 * min(a.h, b.h) or _hgap(a, b) > 40 * u or _contains(a, b) or _contains(b, a):\n            return False\n        if a.kind == \"text\" or b.kind == \"text\":\n            return (a.kind == b.kind == \"text\" and not a.minor and not b.minor and abs(a.size - b.size) < 0.6\n                    and a.align in (\"single\", \"left\") and b.align in (\"single\", \"left\"))\n        # 大きさの違うもの（写真と矢印の図など）の上端・下端を揃える意味はない\n        return a.kind == b.kind and min(a.h, b.h) >= 0.75 * max(a.h, b.h)\n    row_items = [e for e in els if e.kind in (\"image\", \"frame\", \"panel\", \"text\") and not getattr(e, \"band_title\", False)\n                 and getattr(e, \"role\", \"\") != \"marker\" and not getattr(e, \"cutout\", False)]\n    for side, key in ((\"上端\", lambda e: e.y0 if e.kind != \"text\" else e.lines[0][\"y0\"]), (\"下端\", lambda e: e.y1)):\n        its = [(e, key(e)) for e in row_items if not (side == \"下端\" and e.kind == \"text\")]\n        for comp, subs, ref in _edge_groups(its, rowmates, NEAR, EPS):\n            vals = [v for _, v in comp]\n            marks = [(\"h\", v, e.x0, e.x1, \"ref\" if s is ref else \"bad\") for s in subs for e, v in s]\n            F.append(Finding(\"R2\", f\"横に並んだ要素の{side}がわずかにずれている（{mm(max(vals) - min(vals))}）：\"\n                             + \"、\".join(_name(e) for e, _ in comp), max(vals) - min(vals), marks, [e for e, _ in comp]))\n\n    # R2 段落の中の行頭（字下げ）が階段状になっていないか\n    for t in texts:\n        if len(t.lines) < 2 or t.align in (\"center\", \"right\"):\n            continue\n        tol = _tol(t, EPS)\n        # 1文字の3割以上の差は意図した字下げとみなす（全角1字下げ、箇条書きのぶら下げなど）\n        near = min(NEAR, 0.3 * t.size)\n        # 箇条書きの点は点どうし、本文は本文（点の後ろの文字と、折り返した行の行頭）どうしで比べる\n        pts = defaultdict(list)\n        for l in t.lines:\n            if l.get(\"body_x0\") is not None:\n                pts[\"点\"].append((l[\"x0\"], l))\n                pts[\"本文\"].append((l[\"body_x0\"], l))\n            else:\n                pts[\"本文\"].append((l[\"x0\"], l))\n        for kind, its in pts.items():\n            groups = []\n            for x, l in sorted(its, key=lambda p: p[0]):\n                if groups and x - groups[-1][-1][0] < near:\n                    groups[-1].append((x, l))\n                else:\n                    groups.append([(x, l)])\n            for g in groups:\n                v = [x for x, _ in g]\n                if len(g) > 1 and max(v) - min(v) > tol:\n                    what = \"箇条書きの点の位置\" if kind == \"点\" else \"行頭\"\n                    F.append(Finding(\"R2i\", f\"段落{_name(t)}の{what}がわずかにずれている（{len(g)} 行、{mm(max(v) - min(v))}）\",\n                                     max(v) - min(v), [(\"v\", x, l[\"y0\"], l[\"y1\"], \"bad\") for x, l in g], [t]))\n\n    # R5 繰り返す部品の一貫性：見出しの記号と文字の間隔、並んだ画像の大きさ\n    gaps = [(m, h, h.lines[0][\"x0\"] - m.x1) for m, h in pg.marker_pairs]\n    if len(gaps) >= 2:\n        subs = []\n        for m, h, g in sorted(gaps, key=lambda x: x[2]):\n            if subs and g - subs[-1][-1][2] <= _tol(h, EPS):\n                subs[-1].append((m, h, g))\n            else:\n                subs.append([(m, h, g)])\n        if len(subs) > 1:\n            ref = max(subs, key=len)\n            vals = [g for _, _, g in gaps]\n            F.append(Finding(\"R5\", f\"［参考］見出しの記号（■）と文字の間隔が揃っていない（{mm(min(vals))}〜{mm(max(vals))}）：\"\n                             + \"、\".join(f\"{_name(h)} {mm(g)}\" for _, h, g in sorted(gaps, key=lambda x: (x[0].sec, x[0].y0))),\n                             max(vals) - min(vals),\n                             [(\"h\", m.cy, m.x1, h.lines[0][\"x0\"], \"ref\" if s is ref else \"bad\") for s in subs for m, h, _ in s],\n                             [m for m, _, _ in gaps]))\n    for i, a in enumerate(photos):\n        for b in photos[i + 1:]:\n            if not (a.sec == b.sec and min(a.y1, b.y1) - max(a.y0, b.y0) > 0.5 * min(a.h, b.h) and _hgap(a, b) <= 40 * u):\n                continue\n            for dim, va, vb in ((\"幅\", a.w, b.w), (\"高さ\", a.h, b.h)):\n                if EPS < abs(va - vb) < 0.05 * max(va, vb):\n                    f = Finding(\"R5\", f\"並んだ画像の{dim}がわずかに違う（{mm(va)} と {mm(vb)}）\", abs(va - vb),\n                                [(\"h\", a.y1 + 2 * u, a.x0, a.x1, \"bad\"), (\"h\", b.y1 + 2 * u, b.x0, b.x1, \"bad\")]\n                                if dim == \"幅\" else [(\"v\", a.x1 + 2 * u, a.y0, a.y1, \"bad\"), (\"v\", b.x1 + 2 * u, b.y0, b.y1, \"bad\")],\n                                [a, b])\n                    f.no_inset = True  # 大きさの比較なので、端の拡大は意味がない（横に描いた長さの棒で見る）\n                    F.append(f)\n\n    # R6 隣の段の始まりの線を越えている要素\n    for si, cols in pg.columns.items():\n        for ci in range(len(cols) - 1):\n            x = cols[ci + 1][2]\n            nxt = [e for e in els if e.sec == si and e.col == ci + 1]\n            for e in els:\n                if e.sec == si and e.col == ci and e.kind != \"bar\" and e.x0 < x - 15 * u and x + EPS < e.x1 < x + 30 * u:\n                    F.append(Finding(\"R6\", f\"{_name(e)}が隣の段の始まりの線を {mm(e.x1 - x)} 越えている\", e.x1 - x,\n                                     [(\"v\", x, min(o.y0 for o in nxt + [e]), max(o.y1 for o in nxt + [e]), \"ref\"),\n                                      (\"v\", e.x1, e.y0, e.y1, \"bad\")], [e]))\n\n    # R7 同じ区画の段の下端\n    for si, cols in pg.columns.items():\n        if len(cols) < 2:\n            continue\n        # 段をまたぐ横長の行（下に並ぶ組織像など）がある区画では、段の下端は比べられない\n        if any(e.sec == si and e.kind != \"bar\" and e.col is not None and e.col + 1 < len(cols)\n               and e.x1 > cols[e.col + 1][2] + 30 * u for e in els):\n            continue\n        # 段の間の空白を斜めの線・曲線（流れ図の区切り、吹き出しの点線など）が横切る区画は、段ではなく図\n        sy0, sy1 = pg.sections[si]\n        if any(s0 < x - u and x + u < s1 and t0 < sy1 and t1 > sy0\n               for s0, t0, s1, t1 in _strokes(pg) for _, _, x in cols[1:]):\n            continue\n        bottoms = []\n        for ci in range(len(cols)):\n            mine = [e for e in els if e.sec == si and e.col == ci and e.kind != \"bar\"]\n            if mine:\n                bottoms.append(max(mine, key=lambda e: e.y1))\n        vals = [e.y1 for e in bottoms]\n        if len(vals) >= 2 and EPS < max(vals) - min(vals) < 20 * u:\n            ref = sorted(vals)[len(vals) // 2]\n            F.append(Finding(\"R7\", f\"左右の段の下端がわずかにずれている（{mm(max(vals) - min(vals))}）\", max(vals) - min(vals),\n                             [(\"h\", e.y1, e.x0, e.x1, \"ref\" if abs(e.y1 - ref) <= EPS else \"bad\") for e in bottoms], bottoms))\n\n    F.sort(key=Finding.sort_key)\n    return F\n\n\ndef _strokes(pg):\n    \"\"\"線で描いた斜めの線・曲線の範囲（高さ 20u 以上）。枠や水平・垂直の線は含めない。\"\"\"\n    if not hasattr(pg, \"strokes\"):\n        pg.strokes = []\n        for dr in pg.page.get_drawings():\n            r = dr[\"rect\"]\n            if \"s\" not in (dr.get(\"type\") or \"\") or r.height < 20 * pg.u:\n                continue\n            slanted = any(it[0] == \"l\" and abs(it[1].x - it[2].x) > pg.u and abs(it[1].y - it[2].y) > pg.u\n                          for it in dr[\"items\"])\n            if slanted or any(it[0] == \"c\" for it in dr[\"items\"]):\n                pg.strokes.append((r.x0, r.y0, r.x1, r.y1))\n    return pg.strokes\n\n\nclass _Edge:\n    \"\"\"枠にいちばん近い文字の行の端。\"\"\"\n\n    def __init__(self, x, y0, y1):\n        self.x, self.y0, self.y1 = x, y0, y1\n\n\nclass _P:\n    \"\"\"行の中心を点として _contains に渡すための入れ物。\"\"\"\n\n    def __init__(self, l):\n        self.cx, self.cy = (l[\"x0\"] + l[\"x1\"]) / 2, (l[\"y0\"] + l[\"y1\"]) / 2\n", "report.py": "\"\"\"検出結果を、線と番号を描いた画像・JSON・Markdown にする。\"\"\"\nimport json\nimport re\n\nimport pymupdf\nfrom PIL import Image, ImageDraw, ImageFont\n\nOUT_WIDTH_PX = 2800\nCOLORS = {\"ref\": (0, 90, 230), \"bad\": (230, 0, 0)}\n\n\n# Mac では日本語のヒラギノを先に試す（\"Hiragino Sans GB\" は中国語の字形）\n_JA_FONTS = (\"meiryo.ttc\", \"YuGothM.ttc\", \"msgothic.ttc\",\n             \"/System/Library/Fonts/ヒラギノ角ゴシック W4.ttc\", \"Hiragino Sans GB.ttc\")\n_has_ja = None\n\n\ndef _font(size):\n    for name in _JA_FONTS + (\"DejaVuSans.ttf\",):\n        try:\n            return ImageFont.truetype(name, size)\n        except OSError:\n            continue\n    return ImageFont.load_default(size)\n\n\ndef _ja(text):\n    \"\"\"日本語のフォントが無い環境（ブラウザ版）では、画像に描く文字から日本語を除く（数値だけ残す）。\"\"\"\n    global _has_ja\n    if _has_ja is None:\n        _has_ja = False\n        for name in _JA_FONTS:\n            try:\n                ImageFont.truetype(name, 10)\n                _has_ja = True\n                break\n            except OSError:\n                continue\n    return text if _has_ja else re.sub(r\"[^\\x00-\\x7f]+\\s*\", \"\", text).strip()\n\n\ndef draw(pg, findings, path_full, crop_dir=None, stem=\"page\"):\n    z = OUT_WIDTH_PX / pg.W\n    pix = pg.page.get_pixmap(matrix=pymupdf.Matrix(z, z), alpha=False)\n    im = Image.frombytes(\"RGB\", (pix.w, pix.h), pix.samples)\n    # 元の絵を薄くして、線と番号を目立たせる\n    im = Image.blend(im, Image.new(\"RGB\", im.size, (255, 255, 255)), 0.35)\n    d = ImageDraw.Draw(im)\n    lw = max(2, int(OUT_WIDTH_PX / 900))\n    f = _font(max(14, int(OUT_WIDTH_PX / 110)))\n    r = max(10, int(OUT_WIDTH_PX / 150))\n    for n, fd in enumerate(findings, 1):\n        for axis, pos, a, b, role in fd.marks:\n            c = COLORS[role]\n            if axis == \"v\":\n                d.line([pos * z, a * z, pos * z, b * z], fill=c, width=lw)\n            else:\n                d.line([a * z, pos * z, b * z, pos * z], fill=c, width=lw)\n        bad = [m for m in fd.marks if m[4] == \"bad\"] or fd.marks\n        axis, pos, a, b, _ = bad[0]\n        x, y = (pos * z + r + 2, a * z) if axis == \"v\" else (a * z, pos * z - r - 2)\n        d.ellipse([x - r, y - r, x + r, y + r], fill=(230, 0, 0), outline=\"white\", width=2)\n        d.text((x, y), str(n), fill=\"white\", font=f, anchor=\"mm\")\n    im.save(path_full)\n    crops = []\n    if crop_dir is not None:\n        for si, (y0, y1) in enumerate(pg.sections):\n            if not any(getattr(fd.els[0], \"sec\", None) == si for fd in findings):\n                continue\n            box = (0, max(0, int((y0 - 10) * z)), im.width, min(im.height, int((y1 + 10) * z)))\n            if box[3] - box[1] < 20:\n                continue\n            p = crop_dir / f\"{stem}_section{si}.png\"\n            im.crop(box).save(p)\n            crops.append(p)\n    return crops\n\n\ndef _dashed(d, p0, p1, fill, width=2, dash=8):\n    (x0, y0), (x1, y1) = p0, p1\n    length = max(abs(x1 - x0), abs(y1 - y0))\n    for s in range(0, int(length), dash * 2):\n        t0, t1 = s / length, min(1, (s + dash) / length)\n        d.line([x0 + (x1 - x0) * t0, y0 + (y1 - y0) * t0, x0 + (x1 - x0) * t1, y0 + (y1 - y0) * t1], fill=fill, width=width)\n\n\ndef _pairs(fd):\n    \"\"\"ずれている端ごとに、比べる相手の端（同じ向きでいちばん近い基準、無ければ別のずれた端）を選ぶ。\"\"\"\n    out = []\n    bads = [m for m in fd.marks if m[4] == \"bad\"]\n    for b in bads[:3]:\n        others = [m for m in fd.marks if m[0] == b[0] and m is not b and abs(m[1] - b[1]) > 1e-6]\n        refs = [m for m in others if m[4] == \"ref\"] or others\n        out.append((b, min(refs, key=lambda m: abs(m[1] - b[1])) if refs else None))\n    return out\n\n\ndef _render(pg, clip, z):\n    pix = pg.page.get_pixmap(matrix=pymupdf.Matrix(z, z), clip=clip, alpha=False)\n    return Image.blend(Image.frombytes(\"RGB\", (pix.w, pix.h), pix.samples),\n                       Image.new(\"RGB\", (pix.w, pix.h), (255, 255, 255)), 0.25)\n\n\ndef _inset(pg, bad, ref, px=300):\n    \"\"\"ずれた端の近くを拡大し、基準の端を延長した破線と並べて、差を mm で書く。\"\"\"\n    axis, p, a, b, _ = bad\n    if ref is None:  # 比べる相手の端が無いときは、その端の中ほどを拡大する\n        ref = (axis, p, a, b, \"bad\")\n    q, ra, rb = ref[1], ref[2], ref[3]\n    delta = abs(p - q)\n    span = max(6 * delta, 12 * pg.u)\n    # 基準の要素に近いほうの端の近くを見る\n    if ra >= b:\n        t = b  # 基準は下にある：ずれた要素の下端を見る\n    elif rb <= a:\n        t = a  # 基準は上にある：上端を見る\n    else:\n        t = (max(a, ra) + min(b, rb)) / 2  # 並んでいる：重なる範囲の中ほどを見る\n    mid = (p + q) / 2\n    if axis == \"v\":\n        clip = pymupdf.Rect(mid - span / 2, t - span * 0.4, mid + span / 2, t + span * 0.4)\n    else:\n        clip = pymupdf.Rect(t - span * 0.5, mid - span * 0.4, t + span * 0.5, mid + span * 0.4)\n    clip = clip & pg.page.rect\n    if clip.is_empty:\n        return None\n    z = px / max(clip.width, clip.height)\n    im = _render(pg, clip, z)\n    d = ImageDraw.Draw(im)\n    X = lambda x: (x - clip.x0) * z\n    Y = lambda y: (y - clip.y0) * z\n    if axis == \"v\":\n        if delta:\n            _dashed(d, (X(q), 0), (X(q), im.height), COLORS[ref[4]], 3)\n        d.line([X(p), max(0, Y(a)), X(p), min(im.height, Y(b))], fill=COLORS[\"bad\"], width=3)\n    else:\n        if delta:\n            _dashed(d, (0, Y(q)), (im.width, Y(q)), COLORS[ref[4]], 3)\n        d.line([max(0, X(a)), Y(p), min(im.width, X(b)), Y(p)], fill=COLORS[\"bad\"], width=3)\n    lab = _ja(f\"差 {delta * 25.4 / 72:.1f} mm\" if delta else \"拡大\")\n    f = _font(20)\n    if lab:\n        d.rectangle([4, 4, 14 + d.textlength(lab, font=f), 32], fill=\"white\", outline=(120, 120, 120))\n        d.text((9, 7), lab, fill=\"black\", font=f)\n    return im\n\n\ndef draw_each(pg, findings, out_dir, stem=\"page\", max_px=900, head=True):\n    \"\"\"1件ずつ、その指摘だけを描いた画像を作る。\n\n    上に指摘の文、中ほどに周辺（比べた要素を橙の枠、基準の端を延長した青の破線）、\n    下にずれた端の拡大（差を mm で表示）を並べる。\n    \"\"\"\n    out_dir.mkdir(exist_ok=True)\n    u, paths = pg.u, []\n    for n, fd in enumerate(findings, 1):\n        xs = [v for e in fd.els for v in (e.x0, e.x1)]\n        ys = [v for e in fd.els for v in (e.y0, e.y1)]\n        for axis, pos, a, b, _ in fd.marks:\n            xs += [pos] if axis == \"v\" else [a, b]\n            ys += [a, b] if axis == \"v\" else [pos]\n        if fd.context:\n            xs += [fd.context[0], fd.context[2]]\n            ys += [fd.context[1], fd.context[3]]\n        pad = 25 * u\n        clip = pymupdf.Rect(min(xs) - pad, min(ys) - pad, max(xs) + pad, max(ys) + pad) & pg.page.rect\n        z = min(max_px / clip.width, max_px / clip.height, 4)\n        im = _render(pg, clip, z)\n        d = ImageDraw.Draw(im)\n        X = lambda x: (x - clip.x0) * z\n        Y = lambda y: (y - clip.y0) * z\n        for e in fd.els:\n            d.rectangle([X(e.x0) - 2, Y(e.y0) - 2, X(e.x1) + 2, Y(e.y1) + 2], outline=(255, 150, 0), width=2)\n        pairs = _pairs(fd)\n        for bad, ref in pairs:  # 基準の端を、ずれた要素のところまで破線で延ばす\n            if ref is None or getattr(fd, \"no_inset\", False):\n                continue\n            lo, hi = min(bad[2], ref[2]), max(bad[3], ref[3])\n            if bad[0] == \"v\":\n                _dashed(d, (X(ref[1]), Y(lo)), (X(ref[1]), Y(hi)), COLORS[ref[4]])\n            else:\n                _dashed(d, (X(lo), Y(ref[1])), (X(hi), Y(ref[1])), COLORS[ref[4]])\n        for axis, pos, a, b, role in fd.marks:\n            if axis == \"v\":\n                d.line([X(pos), Y(a) - 6, X(pos), Y(b) + 6], fill=COLORS[role], width=3)\n            else:\n                d.line([X(a) - 6, Y(pos), X(b) + 6, Y(pos)], fill=COLORS[role], width=3)\n        fs = _font(18)\n        for x0, x1, y, lab in fd.dims:\n            d.line([X(x0), Y(y), X(x1), Y(y)], fill=(0, 140, 70), width=2)\n            for x in (x0, x1):\n                d.line([X(x), Y(y) - 8, X(x), Y(y) + 8], fill=(0, 140, 70), width=2)\n            lab = _ja(lab)\n            tw = d.textlength(lab, font=fs)\n            cx = (X(x0) + X(x1)) / 2\n            d.rectangle([cx - tw / 2 - 4, Y(y) - 26, cx + tw / 2 + 4, Y(y) - 4], fill=\"white\")\n            d.text((cx - tw / 2, Y(y) - 25), lab, fill=(0, 110, 50), font=fs)\n        insets = [] if getattr(fd, \"no_inset\", False) else \\\n            [i for i in (_inset(pg, b, r) for b, r in pairs) if i is not None]\n        out = _compose(f\"#{n} {fd.title}\" if head else None, im, insets)\n        p = out_dir / f\"{stem}_{n:03d}.png\"\n        out.save(p)\n        paths.append(p)\n    return paths\n\n\ndef _compose(title, main, insets, width=900):\n    \"\"\"指摘の文・周辺の図・拡大図を縦に並べた1枚にする。title が None なら文と凡例を描かない（画面側に出すとき）。\"\"\"\n    f = _font(20)\n    tmp = ImageDraw.Draw(Image.new(\"RGB\", (1, 1)))\n    lines, cur = [], \"\"\n    for ch in title or \"\":  # 日本語なので1文字ずつ折り返す\n        if tmp.textlength(cur + ch, font=f) > width - 24:\n            lines.append(cur)\n            cur = \"\"\n        cur += ch\n    lines.append(cur)\n    head = 14 + 26 * len(lines) + 30 if title else 8\n    row_h = max((i.height for i in insets), default=0)\n    W = max(width, main.width)\n    H = head + main.height + (row_h + 16 if insets else 0) + 8\n    out = Image.new(\"RGB\", (W, H), \"white\")\n    d = ImageDraw.Draw(out)\n    if title:\n        for k, l in enumerate(lines):\n            d.text((12, 10 + 26 * k), l, fill=\"black\", font=f)\n        leg = \"赤＝ずれている端　青＝基準の端（破線は延長）　橙＝比べた要素　下＝拡大\"\n        d.text((12, 12 + 26 * len(lines)), leg, fill=(110, 110, 110), font=_font(15))\n    out.paste(main, (0, head))\n    x = 8\n    for i in insets:\n        out.paste(i, (x, head + main.height + 8))\n        d.rectangle([x - 1, head + main.height + 7, x + i.width, head + main.height + 8 + i.height], outline=(150, 150, 150))\n        x += i.width + 12\n    return out\n\n\ndef write_judge(results, out_dir, src_name, labels=None):\n    \"\"\"1件ずつ「ずれ／ずれではない」を付けてもらうための、手元で開くページ。\n\n    labels（以前の判定）があれば、同じ指摘には前回の判定を入れておき、新しい指摘だけを見せる。\n    \"\"\"\n    import base64\n    import hashlib\n    import io\n    from importlib.resources import files\n    from .evaluate import match_label\n    items = []\n    for p, fs, _, _ in results:\n        for n, f in enumerate(fs, 1):\n            prev = match_label(f, p + 1, labels) if labels else None\n            if prev and prev[\"verdict\"] not in (\"yes\", \"no\"):\n                prev = None  # 「どちらとも」は画像を直したので、もう一度見てもらう\n            # 1ファイルで開けるよう、画像は JPEG にして埋め込む\n            buf = io.BytesIO()\n            Image.open(out_dir / \"each\" / f\"page{p + 1}_{n:03d}.png\").save(buf, \"JPEG\", quality=85)\n            items.append(dict(id=f\"p{p + 1}-{n}\", page=p + 1, no=n, rule=f.rule, title=f.title,\n                              delta_mm=round(f.delta * 25.4 / 72, 1),\n                              boxes=[[round(v, 1) for v in e.box()] for e in f.els],\n                              prev=prev[\"verdict\"] if prev else None, prev_note=prev[\"note\"] if prev else \"\",\n                              img=\"data:image/jpeg;base64,\" + base64.b64encode(buf.getvalue()).decode()))\n    # 検出の中身が変われば別の保存先にし、古い番号の判定を取り違えないようにする\n    ver = hashlib.sha1(\"\".join(i[\"title\"] for i in items).encode()).hexdigest()[:10]\n    tpl = files(\"layout_police\").joinpath(\"judge_template.html\").read_text(encoding=\"utf-8\")\n    html = (tpl.replace(\"__SOURCE__\", json.dumps(src_name, ensure_ascii=False))\n               .replace(\"__VERSION__\", json.dumps(ver))\n               .replace(\"__ITEMS__\", json.dumps(items, ensure_ascii=False)))\n    (out_dir / \"judge.html\").write_text(html, encoding=\"utf-8\")\n\n\ndef write(results, out_dir, src_name):\n    \"\"\"results: [(ページ番号, findings, 画像のパス, 切り出しのパス)]\"\"\"\n    data = dict(source=src_name, pages=[dict(page=p + 1, image=str(img.name), findings=[f.to_dict() for f in fs])\n                                        for p, fs, img, _ in results])\n    (out_dir / \"findings.json\").write_text(json.dumps(data, ensure_ascii=False, indent=1), encoding=\"utf-8\")\n    lines = [f\"# レイアウト警察：{src_name}\", \"\"]\n    total = sum(len(fs) for _, fs, _, _ in results)\n    lines.append(f\"検出 {total} 件。赤い線がずれている端、青い線が基準にした端。番号は画像の番号と対応する。\")\n    for p, fs, img, crops in results:\n        lines += [\"\", f\"## {p + 1} ページ（{len(fs)} 件）\", \"\", f\"![]({img.name})\", \"\"]\n        for n, f in enumerate(fs, 1):\n            lines.append(f\"{n}. [{f.rule}] {f.title}\")\n        for c in crops:\n            lines += [\"\", f\"![]({c.name})\"]\n    (out_dir / \"report.md\").write_text(\"\\n\".join(lines) + \"\\n\", encoding=\"utf-8\")\n", "__driver__.py": "\nimport json, shutil, sys\nfrom pathlib import Path\nsys.path.insert(0, \"/home/pyodide\")\nimport pymupdf\nfrom layout_police import extract as _ex, structure, rules, report\n\ndef measure(progress):\n    out = Path(\"/tmp/out\")\n    shutil.rmtree(out, ignore_errors=True)\n    out.mkdir()\n    doc = pymupdf.open(\"/tmp/in.pdf\")\n    pages = []\n    for pno in range(len(doc)):\n        progress(pno + 1, len(doc))\n        pg, els = _ex.extract(doc, pno)\n        structure.build(pg, els)\n        fs = rules.check(pg, els)\n        if not fs:\n            pages.append({\"page\": pno + 1, \"image\": None, \"findings\": []})\n            continue\n        img = out / f\"page{pno + 1}.png\"\n        report.draw(pg, fs, img)\n        each = report.draw_each(pg, fs, out / \"each\", f\"page{pno + 1}\", head=False)\n        pages.append({\"page\": pno + 1, \"image\": str(img),\n                      \"findings\": [{\"title\": f.title, \"size_mm\": f.to_dict()[\"delta_mm\"], \"image\": str(p)}\n                                   for f, p in zip(fs, each)]})\n    return json.dumps(pages, ensure_ascii=False)\n"}</script>
<script>
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/";
const drop = document.getElementById("drop"), input = document.getElementById("file");
const status = document.getElementById("status"), result = document.getElementById("result");
let busy = false, urls = [];

// 測る処理は別のスレッド（Worker）で動かす。大きな資料でも画面が固まらない
const workerCode = `
importScripts("${PYODIDE}pyodide.js");
let ready = null;
async function init(sources) {
  const py = await loadPyodide({ indexURL: "${PYODIDE}" });
  postMessage({ type: "status", text: "部品を読み込んでいます…" });
  await py.loadPackage(["numpy", "pillow", "pymupdf"]);
  py.FS.mkdirTree("/home/pyodide/layout_police");
  for (const [name, code] of Object.entries(sources)) py.FS.writeFile("/home/pyodide/layout_police/" + name, code);
  py.runPython(sources["__driver__.py"]);
  return py;
}
onmessage = async (e) => {
  try {
    if (e.data.type === "init") { ready = init(e.data.sources); await ready; postMessage({ type: "ready" }); return; }
    const py = await ready;
    py.FS.writeFile("/tmp/in.pdf", new Uint8Array(e.data.buf));
    const progress = (i, n) => postMessage({ type: "status", text: i + " / " + n + " ページを調べています…" });
    const pages = JSON.parse(py.globals.get("measure")(progress));
    const transfer = [];
    for (const p of pages) {
      if (p.image) { p.image = py.FS.readFile(p.image); transfer.push(p.image.buffer); }
      for (const f of p.findings) { f.image = py.FS.readFile(f.image); transfer.push(f.image.buffer); }
    }
    postMessage({ type: "done", pages }, transfer);
  } catch (err) {
    postMessage({ type: "error", text: String(err.message || err).split("\\n").slice(-2).join(" ") });
  }
};`;
const worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: "text/javascript" })));
const sources = JSON.parse(document.getElementById("py-sources").textContent);
let loaded = false, pending = null;
worker.postMessage({ type: "init", sources });
worker.onerror = (e) => {
  clearInterval(timer);
  busy = false;
  status.className = "err";
  status.textContent = "準備できませんでした。インターネットにつながっているか確かめて、ページを開き直してください。（" + (e.message || "") + "）";
};

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "ready") { loaded = true; if (!busy) status.textContent = ""; return; }
  if (m.type === "status") { if (busy) status.textContent = `「${pending}」：${m.text}`; return; }
  clearInterval(timer);
  busy = false;
  if (m.type === "error") { status.className = "err"; status.textContent = "調べられませんでした：" + m.text; return; }
  status.textContent = "";
  show(pending, m.pages);
};

let timer = null;
drop.addEventListener("click", () => !busy && input.click());
drop.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !busy) { e.preventDefault(); input.click(); } });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); });
input.addEventListener("change", () => { if (input.files[0]) send(input.files[0]); input.value = ""; });

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function send(file) {
  if (busy) return;
  status.className = "";
  if (!/\.pdf$/i.test(file.name)) {
    status.className = "err";
    status.textContent = /\.(pptx?|docx?)$/i.test(file.name)
      ? "PowerPoint・Word のファイルは、そのままでは調べられません。「ファイル → エクスポート → PDF」で PDF にしてから渡してください。"
      : "調べられるのは PDF です。";
    return;
  }
  busy = true;
  pending = file.name;
  result.innerHTML = "";
  urls.forEach(URL.revokeObjectURL);
  urls = [];
  const t0 = Date.now();
  status.textContent = loaded ? `「${file.name}」を調べています…` : `「${file.name}」：準備しています（初回は30秒ほどかかります）…`;
  timer = setInterval(() => {
    status.textContent = status.textContent.replace(/（\d+ 秒）$/, "") + `（${Math.round((Date.now() - t0) / 1000)} 秒）`;
  }, 1000);
  const buf = await file.arrayBuffer();
  worker.postMessage({ type: "measure", buf }, [buf]);
}

function img(bytes) {
  const u = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
  urls.push(u);
  return u;
}

function show(name, pages) {
  const total = pages.reduce((s, p) => s + p.findings.length, 0);
  let html = `<div class="summary">「${esc(name)}」：${total} 件</div>`;
  if (!total) {
    result.innerHTML = html + `<div class="none">揃えようとして揃っていないずれは見つかりませんでした。</div>`;
    return;
  }
  html += `<p class="legend"><span><i style="background:#e60000"></i>ずれている端</span><span><i style="background:#005ae6"></i>揃える基準の端</span><span><i style="background:#ff9900"></i>比べたもの</span><span>画像の下は、ずれた端の拡大（数値はずれの大きさ）</span></p>`;
  const many = pages.length > 1;
  for (const p of pages) {
    if (!p.findings.length) continue;
    html += `<h2>${many ? `${p.page} ページ（${p.findings.length} 件）` : `${p.findings.length} 件`}</h2>`;
    html += `<details><summary>${many ? "ページ" : ""}全体を見る（番号は下の一覧と同じ）</summary><img src="${img(p.image)}" alt="${p.page} ページ全体"></details>`;
    p.findings.forEach((f, i) => {
      html += `<div class="card"><div class="head"><span class="no">${i + 1}.</span><span class="title">${esc(f.title)}</span><span class="mm">${f.size_mm} mm</span></div>`
            + `<img src="${img(f.image)}" alt="指摘 ${i + 1} の箇所"></div>`;
    });
  }
  result.innerHTML = html;
}
</script>
</body>
</html>
